<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhotoVault</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#d8d8dc;--acc:#2b6cb0;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececf0;--mut:#9a9aa2;--line:#34343a;--acc:#6ea8ee;--bad:#f2766d}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
label{display:flex;align-items:center;gap:6px;color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:var(--acc)}
#st{margin:8px 0;color:var(--mut)}
pre{background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px;height:340px;overflow:auto;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;margin:8px 0}
textarea{width:100%;box-sizing:border-box;height:360px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px;font:12px/1.4 ui-monospace,monospace}
code{flex:1;overflow:auto;white-space:nowrap;padding:8px 0;color:var(--mut)}
.list{border:1px solid var(--line);border-radius:6px;max-height:300px;overflow:auto;margin-bottom:8px}.list.small{max-height:140px}
.list label{padding:5px 10px;border-bottom:1px solid var(--line);color:var(--fg);display:flex;gap:8px;align-items:center}
.list a{color:var(--acc);cursor:pointer}.list .sz{margin-left:auto;color:var(--mut);font-size:12px}
h2 small{font-weight:normal}
h2{font-size:14px;color:var(--mut);margin:16px 0 4px}
.err{color:var(--bad)}
</style></head><body><main>
<h1>PhotoVault</h1>
<div class="row" id="btns"></div>
<div class="row">
<label><input type="checkbox" id="dry"> Dry run (no changes)</label>
<label><input type="checkbox" id="apply"> Dates: move folders to the right year</label>
<label>ARW with same-name JPG: <select id="existing"><option value="">config default</option><option value="rename">keep both (rename)</option><option value="use_existing">delete ARW, keep JPG</option><option value="overwrite">overwrite JPG</option></select></label>
<button id="cancel">Cancel</button>
</div>
<div class="bar"><i id="bar"></i></div>
<div id="st">Idle</div>
<pre id="log"></pre>
<h2>Backup selection (task 1)</h2>
<div id="pick">
<div class="row"><button id="up">&uarr; Up</button><code id="here"></code><button id="all">Select all here</button><button id="none">Clear here</button></div>
<div id="list" class="list"></div>
<div class="row"><b id="selcount"></b><button id="savesel" class="p">Save selection</button><span id="selmsg"></span></div>
<div id="chosen" class="list small"></div>
</div>
<h2>Schedule</h2><div id="sched"></div>
<h2>Settings <small id="cpath"></small></h2>
<textarea id="cfg" spellcheck="false"></textarea>
<div class="row"><button id="save" class="p">Save settings</button><button id="reload">Reload from file</button><span id="cmsg"></span></div>
<h2>Daemon events</h2><pre id="ev" style="height:100px"></pre>
</main>
<script>
const T=[["sync","1 · Sync to network share"],["ingest","2 · Ingest to local backup"],["archive","3 · Convert + zip"],["dates","4 · Check years"]];
const $=id=>document.getElementById(id);
const post=(u)=>fetch(u,{method:"POST",headers:{"X-Vault":"1"}}).then(r=>r.json());
T.forEach(([t,l])=>{const b=document.createElement("button");b.textContent=l;b.className="p";b.dataset.t=t;
 b.onclick=async()=>{const r=await post(`/api/run?task=${t}&dry=${$("dry").checked?1:0}&apply=${$("apply").checked?1:0}&existing=${$("existing").value}`);if(r.error)alert(r.error);tick()};$("btns").append(b)});
$("cancel").onclick=()=>post("/api/cancel");
const gb=n=>(n/1e9).toFixed(2)+" GB";
async function tick(){
 try{const s=await (await fetch("/api/state")).json();
  document.querySelectorAll("#btns button").forEach(b=>b.disabled=s.running);
  $("cancel").disabled=!s.running;
  const p=s.progress||{};const pct=p.bytes_total?p.bytes_done/p.bytes_total:(p.files_total?p.files_done/p.files_total:0);
  $("bar").style.width=(s.running||s.result?Math.min(100,pct*100):0)+"%";
  $("st").textContent=s.task?`${s.task}: ${s.running?"running":s.result} · ${p.files_done||0}/${p.files_total||0} files · ${gb(p.bytes_done||0)}/${gb(p.bytes_total||0)} · ${(p.mb_s||0).toFixed(0)} MB/s`:"Idle";
  $("st").className=s.result&&s.result!=="ok"?"err":"";
  const l=$("log"),stick=l.scrollTop+l.clientHeight>=l.scrollHeight-20;l.textContent=s.log.join("\n");if(stick)l.scrollTop=l.scrollHeight;
  $("ev").textContent=s.events.join("\n");
  $("sched").textContent=s.schedule.length?s.schedule.join(" · "):"none";
 }catch(e){$("st").textContent="Cannot reach the daemon"}
}
async function loadCfg(){const r=await (await fetch("/api/config")).json();
 if(r.error){$("cmsg").textContent=r.error;$("cmsg").className="err";return}
 $("cfg").value=r.text;$("cpath").textContent=r.path;$("cmsg").textContent="";$("cmsg").className=""}
$("reload").onclick=loadCfg;
$("save").onclick=async()=>{const r=await (await fetch("/api/config",{method:"POST",headers:{"X-Vault":"1"},body:$("cfg").value})).json();
 $("cmsg").className=r.error?"err":"";$("cmsg").textContent=r.error?r.error:("Saved and applied"+(r.note?". "+r.note:""));tick()};
let sel=new Set(),cur="",parent=null,ents=[];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function drawSel(){$("selcount").textContent=sel.size+" selected";
 $("chosen").innerHTML=[...sel].sort().map(p=>`<label><input type="checkbox" checked data-p="${esc(p)}"> ${esc(p)}</label>`).join("")||"<label>Nothing selected</label>";
 $("chosen").querySelectorAll("input").forEach(i=>i.onchange=()=>{sel.delete(i.dataset.p);drawSel();drawList()})}
function drawList(){$("here").textContent=cur||"(allowed folders)";$("up").disabled=cur===""&&parent===null;
 $("list").innerHTML=ents.map((e,i)=>`<label>${cur?`<input type="checkbox" data-i="${i}" ${sel.has(e.path)?"checked":""}>`:""}${e.dir?`<a data-d="${i}">&#128193; ${esc(e.name)}</a>`:`<span>${esc(e.name)}</span><span class="sz">${gb(e.size)}</span>`}</label>`).join("")||"<label>Empty</label>";
 $("list").querySelectorAll("input").forEach(x=>x.onchange=()=>{const p=ents[x.dataset.i].path;x.checked?sel.add(p):sel.delete(p);drawSel()});
 $("list").querySelectorAll("a").forEach(a=>a.onclick=ev=>{ev.preventDefault();browse(ents[a.dataset.d].path)})}
async function browse(p){const r=await (await fetch("/api/browse?path="+encodeURIComponent(p))).json();
 if(r.error){$("selmsg").textContent=r.error;$("selmsg").className="err";return}
 $("selmsg").textContent="";$("selmsg").className="";cur=r.path;parent=r.parent;ents=r.entries;drawList()}
$("up").onclick=()=>browse(parent||"");
$("all").onclick=()=>{ents.forEach(e=>sel.add(e.path));drawSel();drawList()};
$("none").onclick=()=>{ents.forEach(e=>sel.delete(e.path));drawSel();drawList()};
$("savesel").onclick=async()=>{const old=await (await fetch("/api/sources")).json();const lab=new Map(old.sources.map(s=>[s.path,s.label]));
 const body=[...sel].sort().map(p=>lab.get(p)?{path:p,label:lab.get(p)}:{path:p});
 const r=await (await fetch("/api/sources",{method:"POST",headers:{"X-Vault":"1"},body:JSON.stringify(body)})).json();
 $("selmsg").className=r.error?"err":"";$("selmsg").textContent=r.error||"Saved. The scheduled sync will copy exactly these.";if(!r.error)loadCfg()};
(async()=>{const s=await (await fetch("/api/sources")).json();s.sources.forEach(x=>sel.add(x.path));drawSel();browse("")})();
loadCfg();
tick();setInterval(tick,1000);
</script></body></html>
