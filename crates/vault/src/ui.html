<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhotoVault</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#d8d8dc;--acc:#2b6cb0;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececf0;--mut:#9a9aa2;--line:#34343a;--acc:#6ea8ee;--bad:#f2766d}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
label{display:flex;align-items:center;gap:6px;color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:var(--acc)}
#st{margin:8px 0;color:var(--mut)}
pre{background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px;height:340px;overflow:auto;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;margin:8px 0}
h2{font-size:14px;color:var(--mut);margin:16px 0 4px}
.err{color:var(--bad)}
</style></head><body><main>
<h1>PhotoVault</h1>
<div class="row" id="btns"></div>
<div class="row">
<label><input type="checkbox" id="dry"> Dry run (no changes)</label>
<label><input type="checkbox" id="apply"> Dates: move folders to the right year</label>
<label>ARW with same-name JPG: <select id="existing"><option value="">config default</option><option value="rename">keep both (rename)</option><option value="use_existing">delete ARW, keep JPG</option><option value="overwrite">overwrite JPG</option></select></label>
<button id="cancel">Cancel</button>
</div>
<div class="bar"><i id="bar"></i></div>
<div id="st">Idle</div>
<pre id="log"></pre>
<h2>Schedule</h2><div id="sched"></div>
<h2>Daemon events</h2><pre id="ev" style="height:100px"></pre>
</main>
<script>
const T=[["sync","1 · Sync to network share"],["ingest","2 · Ingest to local backup"],["archive","3 · Convert + zip"],["dates","4 · Check years"]];
const $=id=>document.getElementById(id);
const post=(u)=>fetch(u,{method:"POST",headers:{"X-Vault":"1"}}).then(r=>r.json());
T.forEach(([t,l])=>{const b=document.createElement("button");b.textContent=l;b.className="p";b.dataset.t=t;
 b.onclick=async()=>{const r=await post(`/api/run?task=${t}&dry=${$("dry").checked?1:0}&apply=${$("apply").checked?1:0}&existing=${$("existing").value}`);if(r.error)alert(r.error);tick()};$("btns").append(b)});
$("cancel").onclick=()=>post("/api/cancel");
const gb=n=>(n/1e9).toFixed(2)+" GB";
async function tick(){
 try{const s=await (await fetch("/api/state")).json();
  document.querySelectorAll("#btns button").forEach(b=>b.disabled=s.running);
  $("cancel").disabled=!s.running;
  const p=s.progress||{};const pct=p.bytes_total?p.bytes_done/p.bytes_total:(p.files_total?p.files_done/p.files_total:0);
  $("bar").style.width=(s.running||s.result?Math.min(100,pct*100):0)+"%";
  $("st").textContent=s.task?`${s.task}: ${s.running?"running":s.result} · ${p.files_done||0}/${p.files_total||0} files · ${gb(p.bytes_done||0)}/${gb(p.bytes_total||0)} · ${(p.mb_s||0).toFixed(0)} MB/s`:"Idle";
  $("st").className=s.result&&s.result!=="ok"?"err":"";
  const l=$("log"),stick=l.scrollTop+l.clientHeight>=l.scrollHeight-20;l.textContent=s.log.join("\n");if(stick)l.scrollTop=l.scrollHeight;
  $("ev").textContent=s.events.join("\n");
  $("sched").textContent=s.schedule.length?s.schedule.join(" · "):"none";
 }catch(e){$("st").textContent="Cannot reach the daemon"}
}
tick();setInterval(tick,1000);
</script></body></html>
