[package]
name = "vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
kamadak-exif = "0.6.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
toml = "1.2.0"
vault-raw = { path = "../vault-raw" }
walkdir = "2.5.0"
zip = { version = "9.3.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
